{% assign favicon_path = '/assets/img/favicons' | relative_url %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ favicon_path }}/favicon-32x32.png?v=scientist">
<link rel="icon" type="image/png" sizes="16x16" href="{{ favicon_path }}/favicon-16x16.png?v=scientist">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico?v=scientist">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png?v=scientist">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest?v=scientist">
{% endif %}
